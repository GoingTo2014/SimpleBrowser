name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleBrowser-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish public latest build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          tag="simplebrowser-latest"
          asset="app/build/outputs/apk/debug/app-debug.apk"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            target_commit="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)"
            if [ -z "$target_commit" ]; then
              target_commit="$GITHUB_SHA"
            fi

            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$tag" \
              -f target_commitish="$target_commit" \
              -f name="SimpleBrowser latest debug build" \
              -f body="Automatically generated debug APK from the latest successful build." \
              -F prerelease=true

            gh release upload "$tag" "$asset" \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          fi

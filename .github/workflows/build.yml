name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleBrowser-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish public latest build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view simplebrowser-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload simplebrowser-latest               app/build/outputs/apk/debug/app-debug.apk               --clobber               --repo "$GITHUB_REPOSITORY"
          else
            gh release create simplebrowser-latest               app/build/outputs/apk/debug/app-debug.apk               --title "SimpleBrowser latest debug build"               --notes "Automatically generated debug APK from the latest manual GitHub Actions build."               --prerelease               --target "$GITHUB_SHA"               --repo "$GITHUB_REPOSITORY"
          fi

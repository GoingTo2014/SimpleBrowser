name: Build Android APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleBrowser-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Read APK version
        id: apk_version
        run: |
          set -e
          version="$(
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk |
            sed -n "s/.*versionName='\\([^']*\\)'.*/\\1/p"
          )"
          if [ -z "$version" ]; then
            echo "Could not read APK version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building SimpleBrowser $version"

      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.apk_version.outputs.version }}
        run: |
          set -e

          tag="$RELEASE_VERSION"
          asset="app/build/outputs/apk/debug/app-debug.apk"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            target_commit="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)"
            if [ -z "$target_commit" ]; then
              target_commit="$GITHUB_SHA"
            fi

            gh release create "$tag" "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$target_commit" \
              --title "SimpleBrowser $RELEASE_VERSION" \
              --prerelease \
              --notes "## What's new

- Rounded tab cards in the tabs overview.
- Small-screen Settings now uses a vertical full-width section selector with connected rounded corners.
- Cookies page optimized for smaller screens, including stacked cookie actions and full-width site deletion controls.
- Reload button moved next to Forward in the toolbar."
          fi

          latest_tag="simplebrowser-latest"
          if gh release view "$latest_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$latest_tag" "$asset" \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          fi

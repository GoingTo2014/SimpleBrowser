name: Profile cold-start runtime test

on:
  push:
    paths:
      - ".github/workflows/profile-runtime-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile-cold-start:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prepare signing keystore
        env:
          SIMPLEBROWSER_KEYSTORE_BASE64: ${{ secrets.SIMPLEBROWSER_KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -z "$SIMPLEBROWSER_KEYSTORE_BASE64" ]; then
            echo "SIMPLEBROWSER_KEYSTORE_BASE64 is not configured"
            exit 1
          fi
          echo "$SIMPLEBROWSER_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/simplebrowser-release.jks"

      - name: Build signed APK
        env:
          SIMPLEBROWSER_VERSION_NAME: "profile-runtime-test"
          SIMPLEBROWSER_KEYSTORE_FILE: ${{ runner.temp }}/simplebrowser-release.jks
          SIMPLEBROWSER_STORE_PASSWORD: ${{ secrets.SIMPLEBROWSER_STORE_PASSWORD }}
          SIMPLEBROWSER_KEY_ALIAS: ${{ secrets.SIMPLEBROWSER_KEY_ALIAS }}
          SIMPLEBROWSER_KEY_PASSWORD: ${{ secrets.SIMPLEBROWSER_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Run cold-start profile scenario
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            bash "$GITHUB_WORKSPACE/.github/profile-cold-start.sh"


name: Profile cold-start runtime test

on:
  push:
    paths:
      - ".github/workflows/profile-runtime-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile-cold-start:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prepare signing keystore
        env:
          SIMPLEBROWSER_KEYSTORE_BASE64: ${{ secrets.SIMPLEBROWSER_KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -z "$SIMPLEBROWSER_KEYSTORE_BASE64" ]; then
            echo "SIMPLEBROWSER_KEYSTORE_BASE64 is not configured"
            exit 1
          fi
          echo "$SIMPLEBROWSER_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/simplebrowser-release.jks"

      - name: Build signed APK
        env:
          SIMPLEBROWSER_VERSION_NAME: "profile-runtime-test"
          SIMPLEBROWSER_KEYSTORE_FILE: ${{ runner.temp }}/simplebrowser-release.jks
          SIMPLEBROWSER_STORE_PASSWORD: ${{ secrets.SIMPLEBROWSER_STORE_PASSWORD }}
          SIMPLEBROWSER_KEY_ALIAS: ${{ secrets.SIMPLEBROWSER_KEY_ALIAS }}
          SIMPLEBROWSER_KEY_PASSWORD: ${{ secrets.SIMPLEBROWSER_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Run cold-start profile scenario
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            set -eu

            adb install -r "$GITHUB_WORKSPACE/app/build/outputs/apk/release/app-release.apk"
            adb shell pm clear "$package" >/dev/null
            adb logcat -c

            dump_ui() {
              adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
              adb exec-out cat /sdcard/window.xml 2>/dev/null > /tmp/window.xml || true
            }

            find_center() {
              python3 - "$1" <<'PY'
            import re
            import sys
            import xml.etree.ElementTree as ET

            target = sys.argv[1]
            try:
                root = ET.parse("/tmp/window.xml").getroot()
            except Exception:
                raise SystemExit(1)

            for node in root.iter():
                text = node.attrib.get("text", "")
                desc = node.attrib.get("content-desc", "")
                if target == text or target == desc or target in text or target in desc:
                    bounds = node.attrib.get("bounds", "")
                    m = re.match(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]", bounds)
                    if m:
                        x1, y1, x2, y2 = map(int, m.groups())
                        print((x1+x2)//2, (y1+y2)//2)
                        raise SystemExit(0)
            raise SystemExit(1)
            PY
            }

            tap_text() {
              target="$1"
              dump_ui
              center="$(find_center "$target")" || {
                echo "Could not find UI text: $target"
                cat /tmp/window.xml || true
                exit 1
              }
              set -- $center
              adb shell input tap "$1" "$2"
            }

            adb shell am start -n "com.example.simplebrowser/.MainActivity" >/tmp/start1.txt
            sleep 6

            if ! adb shell pidof "com.example.simplebrowser" >/dev/null; then
              echo "SimpleBrowser died on initial launch"
              adb logcat -d
              exit 1
            fi

            tap_text "Browser settings"
            sleep 1
            tap_text "Profile 1"
            sleep 2
            tap_text "Create profile"
            sleep 1

            adb shell input text "RuntimeProfile"
            tap_text "Save"
            sleep 2

            adb shell am force-stop "com.example.simplebrowser"
            adb shell am start -W -n "$package/.MainActivity" >/tmp/start2.txt || true
            sleep 8

            echo "Second launch:"
            cat /tmp/start2.txt || true

            if ! adb shell pidof "$package" >/dev/null; then
              echo "SimpleBrowser died after creating a profile and force-stop"
              adb logcat -d
              exit 1
            fi

            dump_ui
            cat /tmp/window.xml || true

            if adb logcat -d | grep -E "FATAL EXCEPTION|AndroidRuntime.*FATAL|Process: \${package}" >/tmp/fatal.txt; then
              echo "Fatal exception found:"
              cat /tmp/fatal.txt
              adb logcat -d
              exit 1
            fi

            echo "PROFILE COLD-START TEST PASSED"

name: Profile Storage Build Check

on:
  push:
    branches:
      - fix/profile-storage-isolation
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        env:
          SIMPLEBROWSER_KEYSTORE_FILE: ${{ runner.temp }}/unused-debug-signing.jks
          SIMPLEBROWSER_STORE_PASSWORD: unused
          SIMPLEBROWSER_KEY_ALIAS: unused
          SIMPLEBROWSER_KEY_PASSWORD: unused
        run: gradle assembleDebug --no-daemon
